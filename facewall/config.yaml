name: Facewall
version: "1.56.0"
slug: facewall
description: Watch faces and home controls for a wall-mounted iPad
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:watch-variant
panel_title: Facewall
panel_admin: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
  - type: media
    read_only: true
  - type: share
    read_only: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct link for the wall iPad (no login, home network only). Clear it to use the sidebar only.
options:
  allow_outside_home_network: false
schema:
  allow_outside_home_network: bool
